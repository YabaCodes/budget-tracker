<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <script>
    // Apply the saved theme before the first paint so dark mode doesn't flash white.
    (function () {
      try {
        var pref = localStorage.getItem("budgetTrackerTheme") || "system";
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d1017");
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Simple budget: balances, expenses, fixed and flexible budget, and savings goals." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget Tracker" />
  <title>Budget Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-undo" type="button" hidden>Undo</button></div>
  <script src="./app.js"></script>
</body>
</html>
