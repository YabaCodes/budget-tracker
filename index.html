<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget Tracker" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Budget Tracker</title>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <p class="eyebrow">Budget Tracker</p>
        <h1 id="pageTitle">Money</h1>
      </div>
      <div class="month-nav" id="monthNav">
        <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">‹</button>
        <span id="monthLabel" aria-live="polite"></span>
        <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">›</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Sections">
      <button class="nav-btn active" data-tab="home" type="button"><span aria-hidden="true">◎</span>Home</button>
      <button class="nav-btn" data-tab="activity" type="button"><span aria-hidden="true">≡</span>Activity</button>
      <button class="nav-btn" data-tab="budget" type="button"><span aria-hidden="true">▤</span>Budget</button>
      <button class="nav-btn" data-tab="more" type="button"><span aria-hidden="true">⋯</span>More</button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <form method="dialog" id="sheetForm" class="sheet-card" novalidate>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">×</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetActions" class="sheet-actions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toastText"></span>
    <button id="toastUndo" type="button" hidden>Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
